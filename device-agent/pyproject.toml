[project]
name = "mcptoai-agent"
version = "0.2.13"
description = "MCPtoAI device agent: kullanıcının kendi API anahtarıyla cihazda çalışan agent döngüsü + MCP araçları"
requires-python = ">=3.11"

dependencies = [
  # Core #40 parsers; keep synchronized with shared-core/requirements-documents.in
  "pypdf==7.1.0",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "python-pptx==1.0.2",
  "odfpy==1.4.1",
  "Pillow==13.0.0",
  "pillow-heif==1.8.1",
  "striprtf==0.0.35",
  "defusedxml==0.7.1",
  "lxml==6.1.3",
  "et-xmlfile==2.0.0",
  "XlsxWriter==3.3.1",
  "typing-extensions==4.16.0",

  "httpx",
  "PyJWT[crypto]",
  "python-dotenv",
  "keyring",
  # fastmcp ve mcp yeni ana sürümlerde API değiştirdi (streamablehttp_client, get_tools):
  # test edilmiş ana sürümlerle sınırlı. openai, anthropic ve websockets doğrudan
  # kullanılıyor ama listede yoktu; temiz kurulumda agent çalışmıyordu.
  "fastmcp>=4.1.3,<5",
  "mcp>=2.3,<3",
  "openai>=3.19,<4",
  "anthropic>=1.8,<2",
  "websockets>=15,<16",
  "pywin32>=310; sys_platform == 'win32'",
]

[project.scripts]
mcptoai-agent = "mcptoai_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["mcptoai_agent*"]
