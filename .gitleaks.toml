title = "MCPtoAI public source: narrow Auth0 device client ID exception"
[extend]
useDefault = true

# Auth0 device-application client ID is a public identifier already published in 0.1.x.
# All criteria must match; no other identifiers or paths are allowlisted.
[allowlist]
description = "Auth0 device-application client ID is a public identifier already published in 0.1.x"
condition = "AND"
regexTarget = "line"
regexes = ['''^PRODUCTION_AUTH0_DEVICE_CLIENT_ID\s*=\s*["'][A-Za-z0-9_-]+["']\s*$''']
paths = ['''(?:^|/)(device-agent/mcptoai_agent/config\.py|linux-agent/mcptoai_linux/config\.py)$''']
