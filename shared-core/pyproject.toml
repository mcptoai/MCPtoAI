[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcptoai-core"
version = "0.0.0.dev0"
description = "Platform-neutral MCPtoAI agent primitives (pre-release PR-B extraction)"
requires-python = ">=3.11"
dependencies = [
  "pypdf==7.1.0",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "python-pptx==1.0.2",
  "odfpy==1.4.1",
  "Pillow==13.0.0",
  "pillow-heif==1.8.1",
  "striprtf==0.0.35",
  "defusedxml==0.7.1",
  "lxml==6.1.3",
  "et-xmlfile==2.0.0",
  "XlsxWriter==3.3.1",
  "typing-extensions==4.16.0",
]

[tool.setuptools.packages.find]
include = ["mcptoai_core*"]
