[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcptoai-core"
version = "0.0.0.dev0"
description = "Platform-neutral MCPtoAI agent primitives (pre-release PR-B extraction)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["mcptoai_core*"]
