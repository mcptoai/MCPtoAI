name: Bug report
description: Report a reproducible problem in MCPtoAI Desktop or the Device Agent
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MCPtoAI. Please do not report security vulnerabilities here; use SECURITY.md instead.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop app
        - Device Agent
        - MCP integration
        - Update / installer
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MCPtoAI version
      placeholder: e.g. 0.1.9
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Configure ...
        3. Run ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove API keys, tokens, private file contents and other secrets before posting.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and private data from logs and screenshots.
          required: true
        - label: This is not a security vulnerability.
          required: true
