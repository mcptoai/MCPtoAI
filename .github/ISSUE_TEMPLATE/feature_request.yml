name: Feature request
description: Suggest an improvement for MCPtoAI Desktop, the Device Agent or CLI
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Explain the user problem first, then the proposed solution.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app
        - Device Agent
        - Linux CLI
        - Docker
        - MCP integration
        - AI providers / models
        - Security / permissions
        - Installation / updates
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what is difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or workflow you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe any workaround or alternative approach you already tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, related projects or other useful context.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request does not contain secrets or private data.
          required: true
