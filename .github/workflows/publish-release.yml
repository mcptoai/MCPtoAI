name: Publish GitHub Release (manual approval only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.1.18)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate all source versions
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == "v$version" ]] || { echo "Manually dispatch using the approved v$version tag ref, not a branch"; exit 1; }
          python3 - "$version" <<'PY'
          import json, pathlib, re, sys
          version = sys.argv[1]
          desktop = json.loads(pathlib.Path("desktop/package.json").read_text())["version"]
          agent = re.search(r'(?m)^version\s*=\s*"([^"]+)"', pathlib.Path("device-agent/pyproject.toml").read_text()).group(1)
          for name, actual in [("Desktop",desktop),("Device Agent",agent)]:
              print(f"{name}: {actual}")
              if actual != version:
                  raise SystemExit(f"Version mismatch: {name} {actual} != {version}")
          PY
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Verify published packages
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          curl -fsSI "https://api.mcptoai.com/releases/macos/MCPtoAI-$version-arm64.dmg?release=$version" >/dev/null
          curl -fsSI "https://api.mcptoai.com/releases/windows/MCPtoAI-$version-x64-Setup.exe" >/dev/null
      - name: Require an existing signed annotated tag
        run: |
          set -euo pipefail
          git fetch --tags
          tag="refs/tags/v$RELEASE_VERSION"
          [[ "$(git cat-file -t "$tag")" == tag ]] || { echo "Existing signed annotated tag required"; exit 1; }
          git cat-file -p "$tag" | grep -q -- '-----BEGIN SSH SIGNATURE-----' || { echo "Signed SSH tag required"; exit 1; }
          echo "Approved tag $tag points to $(git rev-parse "$tag^{}")"
      - name: Check for existing GitHub Release
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Release v$version already exists; skipping creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub Release with verified binaries (explicit dispatch only)
        if: steps.existing_release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          mkdir -p release-assets
          mac="MCPtoAI-$version-arm64.dmg"
          win="MCPtoAI-$version-x64-Setup.exe"
          curl -fL --retry 3 --max-time 360 -o "release-assets/$mac" "https://api.mcptoai.com/releases/macos/$mac?release=$version"
          curl -fL --retry 3 --max-time 360 -o "release-assets/$win" "https://api.mcptoai.com/releases/windows/$win?release=$version"
          python3 - <<'PYCHECK'
          import hashlib,os,pathlib,re,sys
          version=os.environ['RELEASE_VERSION']
          notes=pathlib.Path(f'docs/RELEASE_NOTES_{version}.md').read_text()
          for name in (f'MCPtoAI-{version}-arm64.dmg',f'MCPtoAI-{version}-x64-Setup.exe'):
              match=re.search(r'`'+re.escape(name)+r'`\s*\|\s*`([a-f0-9]{64})`',notes)
              if not match: sys.exit(f'Approved checksum missing: {name}')
              with open('release-assets/'+name,'rb') as file:
                  digest=hashlib.file_digest(file,'sha256').hexdigest()
              if digest!=match.group(1): sys.exit(f'Hash mismatch: {name}')
              print('VERIFIED',name,digest)
          PYCHECK
          (cd release-assets && sha256sum "$mac" "$win" > SHA256SUMS)
          cp "docs/RELEASE_NOTES_${version}.md" release-notes.md
          gh release create "v$version" "release-assets/$mac" "release-assets/$win" release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "MCPtoAI v$version" \
            --notes-file release-notes.md --latest --verify-tag
