name: Publish Docker image

on:
  push:
    tags:
      - 'docker-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.5)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
      - name: Resolve version and validate tag
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^docker-v([0-9]+\.[0-9]+\.[0-9]+)-r[0-9]+$ ]] || exit 1
            version="${BASH_REMATCH[1]}"
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          grep -q "^version = \"$version\"$" linux-agent/pyproject.toml
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable version plus latest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./linux-agent
          file: ./linux-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mcptoai/mcptoai:${{ env.VERSION }}
            ghcr.io/mcptoai/mcptoai:latest
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image digest using GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/mcptoai/mcptoai@${DIGEST}"
