name: Package security scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  macos-package-scan:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Prepare Device Agent environment
        working-directory: device-agent
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pyinstaller
      - name: Build unsigned macOS package
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MCPTOAI_PYINSTALLER_CODESIGN_IDENTITY: ''
        run: npm run pack:mac:local
      - name: Scan packaged resources
        working-directory: desktop
        run: npm run security:scan:mac
