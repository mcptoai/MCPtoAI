name: Client CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-agent:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: device-agent/pyproject.toml
      - name: Install
        working-directory: device-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Test
        working-directory: device-agent
        run: python -m pytest -q

  linux-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: linux-agent/pyproject.toml
      - name: Install
        working-directory: linux-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Test
        working-directory: linux-agent
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/mcptoai-linux-config
        run: |
          mkdir -p "$XDG_CONFIG_HOME"
          python -m pytest -q

  desktop-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Syntax check first-party JavaScript
        run: |
          set -e
          find desktop/src desktop/scripts -type f -name '*.js' ! -name '*.bak*' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
